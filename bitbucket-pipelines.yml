image: node:20

definitions:
  caches:
    node: ~/.npm
  steps:
    - step: &quality-checks
        name: Quality Checks
        caches:
          - node
        script:
          - rm -rf node_modules
          - npm ci
          - npm run lint
          - npm run type-check
          - npm run test -- --run
          - npm run build
    - step: &build-staging-image
        name: Build & Push Staging Docker Image
        image: docker:24.0.9
        services:
          - docker
        script:
          - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          - export SHORT_SHA=$(echo $BITBUCKET_COMMIT | cut -c1-7)
          - docker build --platform linux/amd64 --build-arg VITE_API_URL=/api/v1 -t tariqsulehri/rct-frontend:staging -t tariqsulehri/rct-frontend:staging-$SHORT_SHA .
          - docker push tariqsulehri/rct-frontend:staging
          - docker push tariqsulehri/rct-frontend:staging-$SHORT_SHA
    - step: &build-master-image
        name: Build & Push Production Master Image
        image: docker:24.0.9
        services:
          - docker
        script:
          - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          - export SHORT_SHA=$(echo $BITBUCKET_COMMIT | cut -c1-7)
          - export TIMESTAMP=$(date +'%m%d%y-%H%M%S')
          - export PKG_VERSION=$(node -p "require('./package.json').version")
          - docker build --platform linux/amd64 --build-arg VITE_API_URL=/api/v1 -t tariqsulehri/rct-frontend:production -t tariqsulehri/rct-frontend:production-$SHORT_SHA -t tariqsulehri/rct-frontend:v$PKG_VERSION-$TIMESTAMP -t tariqsulehri/rct-frontend:latest-$TIMESTAMP .
          - docker push tariqsulehri/rct-frontend:production
          - docker push tariqsulehri/rct-frontend:production-$SHORT_SHA
          - docker push tariqsulehri/rct-frontend:v$PKG_VERSION-$TIMESTAMP
          - docker push tariqsulehri/rct-frontend:latest-$TIMESTAMP

pipelines:
  branches:
    dev:
      - step: *quality-checks
      - step:
          name: Build & Push Dev Docker Image
          image: docker:24.0.9
          services:
            - docker
          script:
            - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            - export SHORT_SHA=$(echo $BITBUCKET_COMMIT | cut -c1-7)
            - docker build --platform linux/amd64 --build-arg VITE_API_URL=/api/v1 -t tariqsulehri/rct-frontend:dev -t tariqsulehri/rct-frontend:dev-$SHORT_SHA .
            - docker push tariqsulehri/rct-frontend:dev
            - docker push tariqsulehri/rct-frontend:dev-$SHORT_SHA

    staging:
      - step: *quality-checks
      - step: *build-staging-image

    master:
      - step: *quality-checks
      - step: *build-master-image

    main:
      - step: *quality-checks
      - step: *build-master-image

  tags:
    'v*.*.*':
      - step: *quality-checks
      - step:
          name: Build & Push Release SemVer Image
          image: docker:24.0.9
          services:
            - docker
          script:
            - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
            - export TAG_VERSION=${BITBUCKET_TAG}
            - export MAJOR_VERSION=$(echo $TAG_VERSION | cut -d. -f1)
            - export MINOR_VERSION=$(echo $TAG_VERSION | cut -d. -f1,2)
            - export SHORT_SHA=$(echo $BITBUCKET_COMMIT | cut -c1-7)
            - docker build --platform linux/amd64 --build-arg VITE_API_URL=/api/v1 -t tariqsulehri/rct-frontend:$TAG_VERSION -t tariqsulehri/rct-frontend:$MINOR_VERSION -t tariqsulehri/rct-frontend:$MAJOR_VERSION -t tariqsulehri/rct-frontend:latest -t tariqsulehri/rct-frontend:production-$SHORT_SHA .
            - docker push tariqsulehri/rct-frontend:$TAG_VERSION
            - docker push tariqsulehri/rct-frontend:$MINOR_VERSION
            - docker push tariqsulehri/rct-frontend:$MAJOR_VERSION
            - docker push tariqsulehri/rct-frontend:latest
            - docker push tariqsulehri/rct-frontend:production-$SHORT_SHA
